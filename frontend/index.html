<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      // The site uses Chinese. Apply the saved theme before the first paint.
      try {
        document.documentElement.dataset.theme = localStorage.getItem('as4x-theme') === 'light' ? 'light' : 'dark';
      } catch { /* Keep the HTML defaults when storage is unavailable. */ }
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preload" as="image" href="/images/lanyard/front.svg" />
    <link rel="preload" as="image" href="/images/lanyard/back.svg" />
    <title>DESIGN.4x</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
